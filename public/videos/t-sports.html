<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://ssl.p.jwpcdn.com/player/v/8.32.1/jwplayer.js" type="text/javascript"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Sports</title>
</head>

<body>
    <div id="player-container"></div>

    <script type="text/javascript">
        jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';  

        jwplayer("player-container").setup({
            file: "https://live.tsports.com/mobile_hls/tsports_live_2/index.m3u8",
            aspectratio: '16:9',
            width: '100%',
            autostart: true,
            image: 'https://i.ibb.co/WxSzQfV/Screenshot-2025-01-06-181955.png', 
            mute: false,
            preload: 'auto',
            captions: { color: 'white', fontSize: '16px', backgroundOpacity: 0 },
            sharing: {
                sites: ['facebook', 'twitter']
            }
        });

        // Ensure playback compatibility for mobile devices
        jwplayer().on('ready', function () {
            const player = document.querySelector('#player-container');
            if (player) {
                player.style.height = window.innerHeight + 'px';
            }
        });

        jwplayer().on('play', function () {
            document.body.style.backgroundColor = "#000"; 
        });

        jwplayer().on('error', function (e) {
            console.error("Playback error:", e.message);
        });
    </script>
</body>

</html>
